on:
  workflow_dispatch:
  push:
    branches: main

name: Optimize Dockerfile package

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: "unnecessary"
          if_key_exists: replace

      # Clean target directory and mirror local workspace files over
      - name: Copy project files to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@3.133.85.99 "mkdir -p /home/ubuntu/app"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa plumber.R ubuntu@3.133.85.99:/home/ubuntu/app/plumber.R

      # Run container with explicitly mapped environments
      - name: Deploy to EC2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@3.133.85.99 << 'EOF'
            sudo apt-get update && sudo apt-get install -y docker.io
            sudo systemctl start docker
            
            sudo docker rm -f penguin-s3-api || true
            
            # FIXED: Corrected the Plumber instantiation execution logic
            sudo docker run -d \
              -p 46261:46261 \
              --name penguin-s3-api \
              -v /home/ubuntu/app:/opt/ml \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_REGION="us-east-2" \
              rocker/r-ver:4.4.2 \
              R -e "install.packages(c('pins', 'vetiver', 'paws', 'plumber'), repos='https://packagemanager.posit.co/cran/__linux__/jammy/latest'); r <- plumber::plumb('/opt/ml/plumber.R'); r\$run(host='0.0.0.0', port=46261)"
          EOF